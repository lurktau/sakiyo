<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SakiyoSong</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --wall: #EBDDF6;
  --wall-deep: #D6C1EE;
  --stripe: rgba(255,255,255,.35);
  --trim: #FFFFFF;
  --foam: #F7AFC9;
  --foam-shade: #E48BAF;
  --desk-top: #F6CFC2;
  --desk-edge: #E9AF9E;
  --desk-front: #D99383;
  --ink: #4A2F5E;
  --ink-soft: #7A5E8C;
  --accent: #FF5C93;
  --accent-deep: #E23C77;
  --mint: #7FE0CB;
  --console: #FFF7FB;
  --console-shadow: #E7C6D8;
  --paper: #FFFBF3;
  --paper-line: #DCE6F7;
  --glow: rgba(255,240,250,.85);
  --font-cute: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --desk-h: clamp(175px, 25dvh, 240px);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --wall: #2E2547;
    --wall-deep: #251D3B;
    --stripe: rgba(255,255,255,.04);
    --trim: #4A3D6B;
    --foam: #7C4C7E;
    --foam-shade: #643A67;
    --desk-top: #6B4A5E;
    --desk-edge: #573A4C;
    --desk-front: #48303F;
    --ink: #F6EAFF;
    --ink-soft: #CDB8DE;
    --console: #3A2F52;
    --console-shadow: #211A33;
    --paper: #FBF4E8;
    --glow: rgba(255,170,215,.22);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --wall: #2E2547; --wall-deep: #251D3B; --stripe: rgba(255,255,255,.04); --trim: #4A3D6B;
  --foam: #7C4C7E; --foam-shade: #643A67; --desk-top: #6B4A5E; --desk-edge: #573A4C; --desk-front: #48303F;
  --ink: #F6EAFF; --ink-soft: #CDB8DE; --console: #3A2F52; --console-shadow: #211A33; --paper: #FBF4E8;
  --glow: rgba(255,170,215,.22);
}

*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--wall);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

/* ───────────── The room ───────────── */
.room {
  position: relative;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 45% 55% at 50% 42%, var(--glow), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 46px, var(--stripe) 46px 50px),
    linear-gradient(var(--wall), var(--wall-deep));
}

.window {
  position: absolute;
  left: 4.5%;
  top: 7%;
  width: clamp(110px, 15vw, 220px);
  aspect-ratio: 3 / 4;
  border-radius: 999px 999px 16px 16px;
  border: 10px solid var(--trim);
  background: linear-gradient(#2F2563, #6E4F9E 62%, #E8A0C4);
  box-shadow: 0 8px 0 rgba(74,47,94,.12);
  overflow: hidden;
}
.window::before, .window::after { content: ""; position: absolute; background: var(--trim); }
.window::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
.window::after { top: 55%; left: 0; right: 0; height: 6px; }
.moon {
  position: absolute; top: 16%; left: 18%;
  width: 24%; aspect-ratio: 1; border-radius: 50%;
  box-shadow: 9px 5px 0 0 #FFF1BE;
}
.star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #FFF6D8; box-shadow: 0 0 6px #FFF6D8; animation: twinkle 3s ease-in-out infinite; }
.star.s1 { top: 22%; left: 70%; }
.star.s2 { top: 40%; left: 30%; animation-delay: -1s; }
.star.s3 { top: 34%; left: 82%; width: 3px; height: 3px; animation-delay: -2s; }
.star.s4 { top: 12%; left: 56%; width: 3px; height: 3px; animation-delay: -.5s; }
@keyframes twinkle { 50% { opacity: .35; } }

.foam {
  position: absolute;
  top: 15%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  width: clamp(120px, 17vw, 260px);
}
.foam-l { right: calc(50% + 9vw); }
.foam-r { left: calc(50% + 9vw); }
.foam span {
  aspect-ratio: 1;
  border-radius: 5px;
  background: repeating-linear-gradient(90deg, var(--foam) 0 7px, var(--foam-shade) 7px 10px);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.07);
}
.foam span:nth-child(even) { background: repeating-linear-gradient(0deg, var(--foam) 0 7px, var(--foam-shade) 7px 10px); }

.onair {
  position: absolute;
  right: 4.5%;
  top: 8%;
  padding: .35em .9em .45em;
  border-radius: 14px;
  border: 4px solid var(--trim);
  background: #5B4868;
  color: #A897B3;
  font-family: var(--font-cute);
  font-size: clamp(14px, 1.6vw, 22px);
  letter-spacing: .04em;
  transition: background .3s, color .3s, box-shadow .3s;
}
body.is-playing .onair {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 0 4px rgba(255,92,147,.25), 0 0 34px var(--accent);
}

/* ───────────── Sakiyo ───────────── */
.stage {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--desk-h) * .42);
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.sakiyo {
  --aspect: .8;
  position: relative;
  height: min(76dvh, calc(92vw / var(--aspect)));
  aspect-ratio: var(--aspect);
  pointer-events: auto;
  cursor: pointer;
}
.sakiyo-body { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 100%; }
.sprite {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: bottom center;
  opacity: 0;
  user-select: none;
  -webkit-user-drag: none;
}
.sprite.on { opacity: 1; }
.sprite-missing {
  position: absolute; inset: 8% 12% 0;
  border-radius: 45% 45% 18% 18%;
  background: rgba(255,255,255,.35);
  border: 3px dashed var(--ink-soft);
  display: grid; place-items: center;
  text-align: center; padding: 1.5em;
  font-size: 14px; color: var(--ink-soft);
}

.mic {
  position: absolute;
  right: -30%;
  top: 22%;
  width: 34%;
  pointer-events: none;
}
.mic svg { width: 100%; height: auto; display: block; overflow: visible; }

/* ───────────── Desk & console ───────────── */
.desk {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--desk-h);
  z-index: 5;
  background:
    linear-gradient(var(--desk-top) 0 20px, var(--desk-edge) 20px 28px, var(--desk-front) 28px);
  box-shadow: 0 -6px 18px rgba(74,47,94,.12);
}

.deskbook {
  display: none;
  position: absolute;
  left: 3.5%;
  top: -46px;
  width: 170px;
  height: 120px;
  border: 0;
  padding: 0;
  background: none;
  transform: rotate(-7deg);
  transition: transform .25s ease;
}
.deskbook:hover { transform: rotate(-4deg) translateY(-6px); }
.deskbook-cover {
  position: absolute; inset: 0 0 10px 0;
  border-radius: 6px 14px 14px 6px;
  background: linear-gradient(135deg, #FF9EC0, #FF7AA8);
  box-shadow: inset 12px 0 0 rgba(0,0,0,.1), 0 10px 0 #FFFBF3, 0 12px 0 #E7C9B9, 0 16px 16px rgba(74,47,94,.2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff;
  font-family: var(--font-cute);
  font-size: 17px;
  line-height: 1.15;
  text-shadow: 0 2px 0 rgba(180,40,90,.35);
}
.deskbook-cover small { display: block; font-family: var(--font-body); font-weight: 800; font-size: 11px; opacity: .9; margin-top: 4px; }
@media (min-width: 1180px) { .deskbook { display: block; } }

.console {
  position: absolute;
  left: 50%;
  top: -34px;
  transform: translateX(-50%);
  width: min(660px, calc(100vw - 20px));
  padding: 14px 16px 12px;
  border-radius: 24px;
  background: var(--console);
  border: 3px solid var(--ink-soft);
  box-shadow: 0 7px 0 var(--console-shadow), 0 14px 24px rgba(40,20,50,.18);
  display: grid;
  gap: 10px;
}
.c-row { display: flex; align-items: center; gap: 12px; min-width: 0; }

.btn-book {
  flex: none;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px 9px 11px;
  border-radius: 14px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  box-shadow: 0 4px 0 var(--accent-deep);
  transition: transform .12s, box-shadow .12s;
}
.btn-book:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn-book svg { width: 20px; height: 20px; }

.nowplaying { min-width: 0; flex: 1; }
.nowplaying p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#npTitle { font-family: var(--font-cute); font-size: 17px; line-height: 1.3; }
#npSub { font-size: 13px; color: var(--ink-soft); font-weight: 700; }

.btn-play {
  flex: none;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 0;
  background: var(--ink);
  color: var(--console);
  display: grid; place-items: center;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
  transition: transform .12s, box-shadow .12s, opacity .2s;
}
.btn-play:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn-play:disabled { opacity: .35; cursor: default; }
.btn-play svg { width: 22px; height: 22px; }

.seek { flex: 1; min-width: 0; accent-color: var(--accent); height: 22px; }
.time { flex: none; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--ink-soft); }

.lamps { display: flex; gap: 7px; }
.lamp {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  font-family: var(--font-cute);
  font-size: 14px;
  background: rgba(122,94,140,.13);
  color: var(--ink-soft);
  transition: background .06s, color .06s, box-shadow .06s;
}
.lamp.lit { background: var(--mint); color: #1F4E45; box-shadow: 0 0 14px var(--mint); }
.lamps-note { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-right: auto; }

.btn-ghost {
  flex: none;
  padding: 7px 12px;
  border-radius: 12px;
  border: 2px solid var(--ink-soft);
  background: transparent;
  font-weight: 800;
  font-size: 13px;
}

.timing-panel {
  position: absolute;
  right: 10px;
  bottom: calc(100% + 12px);
  width: min(340px, calc(100vw - 40px));
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--console);
  border: 3px solid var(--ink-soft);
  box-shadow: 0 7px 0 var(--console-shadow);
}
.timing-panel[hidden] { display: none; }
.timing-panel h3 { margin: 0 0 4px; font-family: var(--font-cute); font-size: 15px; font-weight: 400; }
.timing-panel p { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.timing-panel .c-row { gap: 10px; }
.timing-panel input { flex: 1; accent-color: var(--accent); }
#offsetVal { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: right; font-size: 13px; }

/* ───────────── Karaoke ───────────── */
.karaoke {
  position: absolute;
  left: 50%;
  bottom: calc(var(--desk-h) + 46px);
  transform: translateX(-50%);
  width: min(900px, calc(100vw - 24px));
  z-index: 6;
  pointer-events: none;
  display: grid;
  gap: .25em;
  font-family: var(--font-cute);
  font-size: clamp(21px, 3.6vw, 44px);
  line-height: 1.35;
}
.karaoke[hidden] { display: none; }
.karaoke::before {
  content: "";
  position: absolute;
  inset: -.5em -1em;
  z-index: -1;
  border-radius: 1em;
  background: radial-gradient(ellipse at center, rgba(58,30,78,.42), rgba(58,30,78,0) 72%);
  opacity: 0;
  transition: opacity .4s;
}
.karaoke.has-text::before { opacity: 1; }
.k-row {
  position: relative;
  white-space: nowrap;
  min-height: 1.35em;
  opacity: 0;
  transform: translateY(.3em);
  transition: opacity .3s ease, transform .3s ease;
}
.k-row.show { opacity: 1; transform: none; }
.k-row.done { opacity: .55; }
.k-row.r0 { justify-self: start; padding-left: 4%; }
.k-row.r1 { justify-self: end; padding-right: 4%; }
.k-dots {
  position: absolute;
  bottom: 100%;
  left: 0;
  font-size: .42em;
  letter-spacing: .25em;
  color: #fff;
  text-shadow: 0 0 6px var(--accent), 0 0 2px #4A2F5E;
}
.r0 .k-dots { left: 4%; }
.r1 .k-dots { left: 0; }
.syl {
  --p: 0;
  position: relative;
  display: inline-block;
  color: #fff;
  text-shadow:
    -2px -2px 0 #4A2F5E, 2px -2px 0 #4A2F5E, -2px 2px 0 #4A2F5E, 2px 2px 0 #4A2F5E,
    0 -2px 0 #4A2F5E, 0 2px 0 #4A2F5E, -2px 0 0 #4A2F5E, 2px 0 0 #4A2F5E,
    0 4px 0 rgba(74,47,94,.5);
}
.syl::after {
  content: attr(data-k);
  position: absolute;
  left: 0; top: 0;
  color: #FF5C93;
  text-shadow:
    -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
    0 -2px 0 #fff, 0 2px 0 #fff, -2px 0 0 #fff, 2px 0 0 #fff,
    0 0 14px rgba(255,92,147,.9);
  clip-path: inset(-20% calc((1 - var(--p)) * 100% + 1px) -20% -10px);
}
.syl.pop { animation: pop .32s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 40% { transform: translateY(-.18em) scale(1.14); } }
.syl.gap { margin-left: .35em; }

.label-narrow { display: none; }
.btn-toggle[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ───────────── Song book overlay ───────────── */
.book-overlay {
  position: fixed; inset: 0;
  z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
  padding: 16px;
  background: rgba(46,26,58,.55);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: fadeIn .25s ease;
}
.book-overlay[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; } }

.book-stage {
  container-type: inline-size;
  width: min(980px, 96vw, calc((100dvh - 130px) * 1.45));
  perspective: 2600px;
}
.book {
  position: relative;
  width: 100%;
  aspect-ratio: 1.45 / 1;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.45,.05,.25,1);
}
.leaf {
  position: absolute;
  top: 0; left: 50%;
  width: 50%; height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.45,.05,.25,1);
}
.face {
  position: absolute; inset: 0;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  overflow: hidden;
  border-radius: 0 12px 12px 0;
}
.face.back { transform: rotateY(180deg); border-radius: 12px 0 0 12px; }

.page {
  background:
    repeating-linear-gradient(transparent 0 calc(5.4cqw - 1px), var(--paper-line) calc(5.4cqw - 1px) 5.4cqw) 0 9cqw / 100% 100% no-repeat,
    var(--paper);
  color: #4A2F5E;
  padding: 6cqw 5cqw 4cqw 6cqw;
  cursor: pointer;
}
.face.front.page { box-shadow: inset 4cqw 0 4cqw -3cqw rgba(74,47,94,.18); }
.face.back.page { box-shadow: inset -4cqw 0 4cqw -3cqw rgba(74,47,94,.18); padding: 6cqw 6cqw 4cqw 5cqw; }
.pgno {
  position: absolute; bottom: 2.4cqw;
  font-size: 1.5cqw; font-weight: 800; color: #A891B8;
}
.face.front .pgno { right: 3cqw; }
.face.back .pgno { left: 3cqw; }

/* cover */
.cover {
  background:
    radial-gradient(circle at 18% 20%, rgba(255,255,255,.35) 0 1.2cqw, transparent 1.3cqw),
    radial-gradient(circle at 80% 78%, rgba(255,255,255,.3) 0 .9cqw, transparent 1cqw),
    linear-gradient(140deg, #FFA6C6, #FF6F9F);
  box-shadow: inset 2.2cqw 0 0 rgba(150,20,70,.18), inset 0 0 0 .6cqw rgba(255,255,255,.25);
  color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
}
.cover-label {
  background: #FFFBF3;
  color: #E23C77;
  border-radius: 1.6cqw;
  padding: 2.2cqw 3cqw 2.6cqw;
  box-shadow: 0 .6cqw 0 rgba(150,20,70,.25);
  transform: rotate(-2deg);
}
.cover-label h1 { margin: 0; font-family: var(--font-cute); font-weight: 400; font-size: 3.9cqw; line-height: 1.15; }
.cover-label p { margin: 1cqw 0 0; font-weight: 800; font-size: 1.6cqw; color: #B5648B; }
.cover-hint { margin-top: 3cqw; font-weight: 800; font-size: 1.6cqw; opacity: .95; }
.heart { width: 7cqw; margin-bottom: 2.5cqw; filter: drop-shadow(0 .5cqw 0 rgba(150,20,70,.25)); }

.backcover {
  background: linear-gradient(220deg, #FFA6C6, #FF6F9F);
  box-shadow: inset -2.2cqw 0 0 rgba(150,20,70,.18);
  cursor: pointer;
}
.endpaper {
  background:
    radial-gradient(circle, #FFC2D7 0 .7cqw, transparent .8cqw) 0 0 / 4cqw 4cqw,
    #FFE3EC;
}

/* contents page */
.toc h2 { margin: 0 0 1cqw; font-family: var(--font-cute); font-weight: 400; font-size: 3.2cqw; color: #E23C77; }
.toc .lead { margin: 0 0 3cqw; font-size: 1.7cqw; line-height: 1.6; font-weight: 700; color: #7A5E8C; max-width: 34ch; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li button {
  width: 100%;
  display: flex; align-items: baseline; gap: 1cqw;
  background: none; border: 0; padding: 1.1cqw 0;
  font-size: 1.9cqw; font-weight: 800; color: #4A2F5E;
  text-align: left;
}
.toc li button:hover .toc-title { color: #E23C77; }
.toc-dots { flex: 1; border-bottom: .3cqw dotted #C9B3D8; transform: translateY(-.5cqw); }

/* song page */
.songpage { display: flex; flex-direction: column; }
.tape {
  position: absolute; top: 1.6cqw; left: 50%;
  width: 12cqw; height: 3.4cqw;
  transform: translateX(-50%) rotate(-3deg);
  background: repeating-linear-gradient(45deg, rgba(255,140,180,.55) 0 1cqw, rgba(255,190,210,.55) 1cqw 2cqw);
}
.song-num {
  width: 6cqw; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--song, #FF8FB1); color: #fff;
  font-family: var(--font-cute); font-size: 2.6cqw;
  box-shadow: 0 .5cqw 0 rgba(0,0,0,.12);
  margin: 1cqw 0 2.4cqw;
  transform: rotate(-6deg);
}
.songpage h2 { margin: 0; font-family: var(--font-cute); font-weight: 400; font-size: 4.4cqw; line-height: 1.2; }
.songpage .romaji { margin: .6cqw 0 0; font-size: 2.2cqw; font-weight: 800; color: #E23C77; }
.songpage .aka { margin: .4cqw 0 0; font-size: 1.7cqw; font-weight: 700; color: #7A5E8C; }
.songpage .by { margin: 2.6cqw 0 0; font-size: 1.8cqw; font-weight: 700; }

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   SETTINGS YOU CAN EDIT
   ════════════════════════════════════════════════════════════════ */

// Where the sprite PNGs live. File name = sprite name + ".png"
const SPRITE_BASE = 'https://file.garden/ZyUgbYyEhGi7VILo/sakiyo/';

// Which sprite to use for each job. Change the text on the right
// if you rename a sprite file.
const SPRITES = {
  idle:   'default eyes open mouth closed',
  blink1: 'blink 1 eyes open mouth closed',   // eyes starting to close
  blink2: 'blink 2 eyes open mouth closed',   // eyes almost closed
  blink3: 'blink eyes closed mouth closed',   // eyes fully closed
  a: 'singing a eyes open mouth open',
  i: 'singing i eyes open mouth open',
  u: 'singing u eyes open mouth open',
  e: 'singing e eyes open mouth open',
  o: 'singing o eyes open mouth open',
};

// The song book. Add a new song by copying one { ... } block,
// putting a comma between blocks, and dropping the .ust file
// into the "songs" folder next to this page.
const SONGS = [
  {
    title:    'おちゃめ機能',
    romaji:   'Ochame Kinou',
    aka:      'also known as “Fukkireta”',
    producer: 'ゴジマジP',
    audio:    'https://file.garden/ZyUgbYyEhGi7VILo/sakiyo/wavs/fukkireta.wav',
    ust:      'songs/fukkireta.ust',
    color:    '#EC4F86',
  },
  {
    title:    'Kiss me 愛してる',
    romaji:   'Kiss Me Aishiteru',
    aka:      'also known as “Kiss Me I Love You”',
    producer: '°C-ute',
    audio:    'https://file.garden/ZyUgbYyEhGi7VILo/sakiyo/wavs/kiss%20me%20aishiteru.wav',
    ust:      'songs/kiss.ust',
    color:    '#9A5FD6',
  },
  {
    title:    'lllトゥルティンアンテナlll',
    romaji:   'Toluthin Antenna',
    aka:      '',
    producer: 'レタスP & Giga',
    audio:    'https://file.garden/ZyUgbYyEhGi7VILo/sakiyo/wavs/toluthin%20antenna.wav',
    ust:      'songs/toluthin.ust',
    color:    '#2A9A7C',
  },
  {
    title:    '翼をください',
    romaji:   'Tsubasa o Kudasai',
    aka:      'also known as “Please Give Me Wings”',
    producer: 'ベッキー･クルーエル',
    audio:    'https://file.garden/ZyUgbYyEhGi7VILo/sakiyo/wavs/tsubasa%20o%20kudasai.wav',
    ust:      'songs/tsubasa.ust',
    color:    '#3C86D6',
  },
];

// Karaoke line breaking.
const KARAOKE = {
  breakAtRest: 300,   // a pause this long (ms) always starts a new line
  maxPerLine: 14,     // most syllables on one line
  minPerLine: 7,      // when splitting a long run, lines are at least this long
  countdownGap: 4000, // after a pause this long, show ● ● ● before the next line
};

// Fine tuning for the mouth (milliseconds).
const LIP = {
  closeBeforeLips: 70,      // close the mouth before ま/ば/ぱ-row notes
  closeBeforeSameVowel: 55, // tiny close between two notes with the same vowel
  restForBlink: 600,        // a gap at least this long counts as a breath, so she blinks
};

/* ════════════════════════════════════════════════════════════════
   Everything below here is the machinery.
   ════════════════════════════════════════════════════════════════ */

const $ = (s) => document.querySelector(s);
const audio = $('#audio');
const sakiyo = $('#sakiyo');
const body = $('#sakiyoBody');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);

/* ───── Toast ───── */
let toastTimer = 0;
function toast(msg, ms = 6000) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

/* ───── Sprites ───── */
const spriteEls = {};
const spriteOk = {};
let shown = null;

function spriteUrl(name) { return SPRITE_BASE + encodeURIComponent(name) + '.png'; }

function loadSprites() {
  const keys = Object.keys(SPRITES);
  let settled = 0;
  return new Promise((resolve) => {
    keys.forEach((key) => {
      const img = new Image();
      img.className = 'sprite';
      img.alt = '';
      img.decoding = 'async';
      img.draggable = false;
      img.onload = () => {
        spriteOk[key] = true;
        if (key === 'idle') sakiyo.style.setProperty('--aspect', (img.naturalWidth / img.naturalHeight).toFixed(4));
        done();
      };
      img.onerror = () => {
        spriteOk[key] = false;
        console.warn('Sprite failed to load:', SPRITES[key], spriteUrl(SPRITES[key]));
        done();
      };
      img.src = spriteUrl(SPRITES[key]);
      body.appendChild(img);
      spriteEls[key] = img;
    });
    function done() {
      settled++;
      $('#loaderInfo').textContent = `Sakiyo is getting ready (${settled} of ${keys.length})`;
      if (settled === keys.length) resolve();
    }
  });
}

function setSprite(key) {
  if (!spriteOk[key]) key = spriteOk.idle ? 'idle' : null;
  if (!key || key === shown) return;
  if (shown) spriteEls[shown].classList.remove('on');
  spriteEls[key].classList.add('on');
  shown = key;
}

/* ───── UST parsing ───── */
function decodeUST(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (_) { return new TextDecoder('shift_jis').decode(buf); }
}

function parseUST(text) {
  let section = null, baseTempo = 120, cur = null;
  const raw = [];
  for (const line0 of text.split(/\r?\n/)) {
    const line = line0.trim();
    if (!line) continue;
    const head = line.match(/^\[#(.+)\]$/);
    if (head) {
      if (cur) raw.push(cur);
      cur = null;
      section = head[1];
      if (/^\d+$/.test(section)) cur = { len: 0, lyric: '', tempo: null };
      continue;
    }
    const eq = line.indexOf('=');
    if (eq < 0) continue;
    const k = line.slice(0, eq).trim(), v = line.slice(eq + 1).trim();
    if (section === 'SETTING' && k === 'Tempo') baseTempo = parseFloat(v.replace(',', '.')) || baseTempo;
    if (cur) {
      if (k === 'Length') cur.len = parseInt(v, 10) || 0;
      else if (k === 'Lyric') cur.lyric = v;
      else if (k === 'Tempo') cur.tempo = parseFloat(v.replace(',', '.')) || null;
    }
  }
  if (cur) raw.push(cur);

  let t = 0, beat = 0, tempo = baseTempo;
  const tempoMap = [{ ms: 0, beat: 0, tempo }];   // where the tempo changes, for the sway
  const notes = raw.map((n) => {
    if (n.tempo && n.tempo !== tempo) { tempo = n.tempo; tempoMap.push({ ms: t, beat, tempo }); }
    const d = n.len * 60000 / (tempo * 480);   // 480 ticks per beat
    const note = { start: t, end: t + d, lyric: n.lyric };
    t += d;
    beat += n.len / 480;
    return note;
  });
  return { notes, duration: t, tempo: baseTempo, tempoMap };
}

/* ───── Lyric → vowel ───── */
const KANA_VOWEL = {};
[
  ['a', 'あかがさざただなはばぱまやらわぁゃゎ'],
  ['i', 'いきぎしじちぢにひびぴみりぃゐ'],
  ['u', 'うくぐすずつづぬふぶぷむゆるぅゅゔ'],
  ['e', 'えけげせぜてでねへべぺめれぇゑ'],
  ['o', 'おこごそぞとどのほぼぽもよろをぉょ'],
].forEach(([v, chars]) => { for (const c of chars) KANA_VOWEL[c] = v; });
const LIP_CLOSERS = 'まみむめもばびぶべぼぱぴぷぺぽ';

function toHiragana(s) {
  return s.replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function cleanLyric(lyric) {
  let s = (lyric || '').trim();
  if (s.includes(' ')) s = s.split(' ').pop();          // VCV like "a ka"
  s = s.replace(/^-+/, '').replace(/[0-9↑↓]+$/g, '');    // "- ka", pitch suffixes
  return toHiragana(s);
}
function vowelOf(lyric) {
  const s = cleanLyric(lyric);
  if (!s || /^(r|rest|br|息|吸)$/i.test(s)) return 'rest';
  const last = s[s.length - 1];
  if (last === 'ん') return 'closed';
  if (last === 'っ') return 'closed';
  if (last === 'ー' || last === '～' || last === '~') return 'hold';
  if (KANA_VOWEL[last]) return KANA_VOWEL[last];
  const low = s.toLowerCase();
  if (low === 'n') return 'closed';
  const m = low.match(/[aiueo]/);
  return m ? m[0] : 'closed';
}
function startsWithLips(lyric) {
  const s = cleanLyric(lyric);
  if (!s) return false;
  return LIP_CLOSERS.includes(s[0]) || /^[mbp]/i.test(s);
}

/* Build the list of "mouth open" moments for a song. */
function buildMouth(notes) {
  const kinds = notes.map((n) => vowelOf(n.lyric));
  for (let i = 0; i < kinds.length; i++) {
    if (kinds[i] === 'hold') kinds[i] = (i > 0 && kinds[i - 1].length === 1) ? kinds[i - 1] : 'closed';
  }
  const segs = [];
  for (let i = 0; i < notes.length; i++) {
    const v = kinds[i];
    if (v.length !== 1) continue;                 // rest / closed
    let { start, end } = notes[i];
    const dur = end - start;
    const nx = notes[i + 1];
    if (nx && kinds[i + 1] !== 'rest') {
      let cut = 0;
      if (startsWithLips(nx.lyric)) cut = Math.min(LIP.closeBeforeLips, dur * 0.3);
      else if (kinds[i + 1] === v) cut = Math.min(LIP.closeBeforeSameVowel, dur * 0.25);
      end -= cut;
    }
    const last = segs[segs.length - 1];
    if (last && last.v === v && start - last.end < 1) last.end = end;
    else segs.push({ start, end, v });
  }
  return segs;
}

/* Karaoke: turn notes into lines of syllables. */
function displayLyric(lyric) {
  let s = (lyric || '').trim();
  if (s.includes(' ')) s = s.split(' ').pop();
  return s.replace(/^-+/, '').replace(/[0-9↑↓]+$/g, '');
}
function buildLines(notes) {
  // 1. syllables, with pauses remembered
  const syls = [];
  let pendingStart = null;   // a lone consonant (like "d") folds into the next syllable
  let restBefore = 0;
  for (const n of notes) {
    const kind = vowelOf(n.lyric);
    const text = displayLyric(n.lyric);
    if (kind === 'rest') { restBefore += n.end - n.start; continue; }
    if (kind === 'closed' && !/[んンっッ]/.test(text)) { if (pendingStart === null) pendingStart = n.start; continue; }
    if (kind === 'hold' && syls.length && restBefore === 0) { syls[syls.length - 1].end = n.end; continue; }
    syls.push({ text, start: pendingStart ?? n.start, end: n.end, rest: restBefore });
    pendingStart = null;
    restBefore = 0;
  }
  // 2. split into phrases at real pauses
  const phrases = [];
  let cur = [];
  for (const sy of syls) {
    if (cur.length && sy.rest >= KARAOKE.breakAtRest) { phrases.push(cur); cur = []; }
    cur.push(sy);
  }
  if (cur.length) phrases.push(cur);
  // 3. break long phrases at the most "breath-like" spot
  const lines = [];
  for (const ph of phrases) {
    let i = 0;
    while (ph.length - i > KARAOKE.maxPerLine) {
      let best = i + KARAOKE.minPerLine - 1, bestScore = -1;
      for (let j = i + KARAOKE.minPerLine - 1; j < Math.min(i + KARAOKE.maxPerLine, ph.length - 1); j++) {

        if (score > bestScore) { bestScore = score; best = j; }
      }
      lines.push(ph.slice(i, best + 1));
      i = best + 1;

    lines.push(ph.slice(i));

  for (let k = lines.length - 1; k > 0; k--) {

    if ((b.length < 3 || a.length < 3) && a.length + b.length <= KARAOKE.maxPerLine && b[0].rest < 900) {

}

async function loadSong(song) {
  try {
    const res = await fetch(song.ust);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const parsed = parseUST(decodeUST(await res.arrayBuffer()));
    song.mouth = buildMouth(parsed.notes);
    song.lines = buildLines(parsed.notes);
    song.duration = parsed.duration;
    song.tempoMap = parsed.tempoMap;
    song.loadError = null;
  } catch (err) {
    console.warn('Could not load', song.ust, err);
    song.mouth = [];
    song.lines = [];

  const ov = $('#bookOverlay');
  ov.hidden = false;
  cur = 0;
  showLeft = false;
  layoutBook();
  // reopen at the current song, or at the contents page the first time
  const page = state.songIndex >= 0 ? pages[1].songPages[state.songIndex] : 1;
  setTimeout(() => goPage(page), reduceMotion ? 0 : 320);
  $('#closeBook').focus();
}
function closeBook() {
  $('#bookOverlay').hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

$('#openBook').addEventListener('click', openBook);
$('#deskBook').addEventListener('click', openBook);
$('#closeBook').addEventListener('click', closeBook);
$('#prevPage').addEventListener('click', () => step(-1));
$('#nextPage').addEventListener('click', () => step(1));
$('#bookOverlay').addEventListener('click', (e) => { if (e.target.id === 'bookOverlay') closeBook(); });

document.addEventListener('keydown', (e) => {
  const bookOpen = !$('#bookOverlay').hidden;
  if (bookOpen) {
    if (e.key === 'Escape') closeBook();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    return;
  }
  if (e.target.closest('input, button')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase() === 'k') setKaraoke(!karaoke.on);
  else if (e.key.toLowerCase() === 'b') openBook();
});

/* ───── Start ───── */
(async function start() {
  await Promise.all([loadSprites(), Promise.all(SONGS.map(loadSong))]);
  if (!spriteOk.idle) {
    const miss = document.createElement('div');
    miss.className = 'sprite-missing';
    miss.textContent = 'Sakiyo’s sprites didn’t load. Check SPRITE_BASE and the names in SPRITES.';
    body.appendChild(miss);
  }
  const missing = Object.keys(SPRITES).filter((k) => !spriteOk[k]);
  if (missing.length && spriteOk.idle) toast('Some sprites didn’t load: ' + missing.map((k) => `“${SPRITES[k]}”`).join(', '), 9000);
  buildBook();
  $('#npSub').textContent = 'Sakiyo is ready to sing.';
  $('#playBtn').disabled = false;
  setSprite('idle');
  $('#loader').classList.add('gone');
  requestAnimationFrame(frame);
})();

})();
</script>
</body>
